<header class="header">
  <div class="logo">PinkStore</div>

  <div class="search">
    <input
      type="text"
      placeholder="Search products..."
      [value]="searchTerm"
      (input)="searchTerm = ($any($event.target).value)"
    />
  </div>
</header>

<div class="layout">
  <aside class="cats">
    @for (c of categories; track c.id) {
      <button
        (click)="selectCategory(c.id)"
        [class.active]="c.id === selectedCategoryId">
        {{ c.name }}
      </button>
    }
  </aside>

  <main class="content">
      <app-product-list
        [products]="selectedProducts"
        [searchTerm]="searchTerm">
      </app-product-list>
  </main>
</div>

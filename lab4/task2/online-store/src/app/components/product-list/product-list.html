<div class="search-info" *ngIf="searchTerm()">
  <h2>Results for: "{{ searchTerm() }}"</h2>
</div>

<div class="no-results" *ngIf="searchTerm() && filteredProducts.length === 0">
  No products found for "{{ searchTerm() }}"
</div>

<div class="grid">
  <app-product-card
    *ngFor="let product of filteredProducts"
    [product]="product">
  </app-product-card>
</div>
